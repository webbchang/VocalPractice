<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocal Practice - 使用者後台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        .header {
            background: #16213e;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .header h1 {
            font-size: 20px;
            color: #fff;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #3498db;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #3498db;
            color: white;
        }
        .btn-primary:hover {
            background: #2980b9;
        }
        .btn-success {
            background: #27ae60;
            color: white;
        }
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        .btn-secondary {
            background: #95a5a6;
            color: white;
            padding: 6px 12px;
            font-size: 12px;
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }
        .btn-icon {
            width: 32px;
            height: 32px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: #2c3e50;
            color: #888;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
        }
        .btn-icon:hover {
            background: #34495e;
            color: #fff;
        }
        .btn-icon.disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .btn-icon.disabled:hover {
            background: #2c3e50;
            color: #888;
        }
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 24px;
        }
        .sidebar {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            height: fit-content;
        }
        .sidebar h3 {
            font-size: 14px;
            color: #888;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .user-profile {
            text-align: center;
            padding: 20px;
            background: #1a1a2e;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #3498db;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 600;
            margin: 0 auto 12px;
        }
        .profile-name {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }
        .profile-email {
            font-size: 13px;
            color: #888;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-item {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #3498db;
        }
        .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        .content-area {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .card {
            background: #16213e;
            border-radius: 12px;
            padding: 24px;
        }
        .card h3 {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .tab {
            padding: 10px 20px;
            background: #1a1a2e;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            color: #888;
            transition: all 0.2s;
        }
        .tab:hover {
            color: #fff;
        }
        .tab.active {
            background: #3498db;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .storage-panel {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .storage-title {
            font-size: 14px;
            color: #888;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .storage-bar {
            width: 100%;
            height: 10px;
            background: #2c3e50;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .storage-fill {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #2ecc71);
            border-radius: 5px;
            transition: width 0.3s;
        }
        .storage-fill.warning {
            background: linear-gradient(90deg, #f39c12, #e74c3c);
        }
        .storage-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
        }
        .history-item {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .history-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }
        .history-score {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            margin-right: 16px;
        }
        .score-high { background: #d4edda; color: #155724; }
        .score-mid { background: #fff3cd; color: #856404; }
        .score-low { background: #f8d7da; color: #721c24; }
        .history-info {
            flex: 1;
        }
        .history-song {
            font-size: 14px;
            font-weight: 600;
        }
        .history-detail {
            font-size: 12px;
            color: #888;
        }
        .history-date {
            font-size: 12px;
            color: #666;
        }
        .history-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .sync-status {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #2c3e50;
        }
        .sync-item {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #16213e;
            border-radius: 6px;
            font-size: 13px;
        }
        .sync-item.local {
            border-left: 3px solid #3498db;
        }
        .sync-item.cloud {
            border-left: 3px solid #27ae60;
        }
        .sync-item.unavailable {
            opacity: 0.4;
        }
        .sync-item.unavailable .sync-icon {
            filter: grayscale(1);
        }
        .sync-icon {
            font-size: 16px;
        }
        .sync-label {
            flex: 1;
        }
        .sync-size {
            color: #888;
            font-size: 12px;
        }
        .sync-tooltip {
            font-size: 11px;
            color: #f39c12;
            margin-top: 4px;
        }
        .message-item {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 4px solid #3498db;
        }
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .message-title {
            font-weight: 600;
            color: #fff;
        }
        .message-date {
            font-size: 12px;
            color: #888;
        }
        .message-content {
            font-size: 14px;
            color: #ccc;
            line-height: 1.5;
        }
        .message-unread {
            border-left-color: #e74c3c;
        }
        .platform-notice {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
            border-left: 4px solid #f39c12;
            font-size: 13px;
            color: #f39c12;
        }
        .platform-notice strong {
            display: block;
            margin-bottom: 4px;
            color: #fff;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.visible {
            display: flex;
        }
        .modal {
            background: #16213e;
            border-radius: 12px;
            padding: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal h3 {
            margin-bottom: 16px;
            color: #fff;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            justify-content: flex-end;
        }
        .assessment-detail {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .assessment-detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #2c3e50;
        }
        .assessment-detail-row:last-child {
            border-bottom: none;
        }
        .detail-label {
            color: #888;
        }
        .detail-value {
            color: #fff;
            font-weight: 600;
        }
        .legend {
            display: flex;
            gap: 16px;
            margin-top: 16px;
            padding: 12px;
            background: #1a1a2e;
            border-radius: 8px;
            font-size: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-icon {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎤 Vocal Practice - 使用者後台</h1>
        <div class="header-right">
            <div class="user-info">
                <div class="user-avatar" id="header-avatar">?</div>
                <span id="header-username"></span>
            </div>
            <button class="btn btn-primary" onclick="window.__startPractice()">🎤 開始練習</button>
            <button class="btn btn-danger" onclick="window.__logout()">登出</button>
        </div>
    </div>

    <div class="main-container">
        <div class="dashboard-grid">
            <!-- 左側邊欄 -->
            <div class="sidebar">
                <div class="user-profile">
                    <div class="profile-avatar" id="profile-avatar">?</div>
                    <div class="profile-name" id="profile-name"></div>
                    <div class="profile-email" id="profile-email"></div>
                </div>

                <h3>練習統計</h3>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="stat-practices">–</div>
                        <div class="stat-label">練習次數</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="stat-avg-score">–</div>
                        <div class="stat-label">平均分數</div>
                    </div>
                    <div class="stat-item" style="grid-column: span 2;">
                        <div class="stat-value" id="stat-songs">–</div>
                        <div class="stat-label">練習歌曲</div>
                    </div>
                </div>

                <h3>快速連結</h3>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <button class="btn btn-primary btn-sm" onclick="window.__startPractice()">🎤 開始練習</button>
                    <button class="btn btn-secondary btn-sm" onclick="window.__scrollToHistory()">📊 練習記錄</button>
                </div>
            </div>

            <!-- 主要內容區 -->
            <div class="content-area">
                <!-- 練習記錄 -->
                <div class="card">
                    <h3>
                        📊 練習記錄
                        <button class="btn btn-secondary btn-sm" onclick="window.__loadDashboard()">🔄 重新整理</button>
                    </h3>

                    <!-- 歷史記錄列表 -->
                    <div id="history-list">
                        <div style="color:#888;padding:16px;">載入中…</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Assessment Detail Modal -->
    <div class="modal-overlay" id="assessment-modal">
        <div class="modal">
            <h3>評分詳細資訊</h3>
            <div id="assessment-detail-content">
                <!-- Dynamic content -->
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="window.__closeModal()">關閉</button>
                <button class="btn btn-primary" onclick="window.__downloadCurrentAssessment()">📥 下載</button>
                <button class="btn btn-danger" onclick="window.__deleteCurrentAssessment()">🗑️ 刪除</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { api } from '../assets/js/api.js';

        // Check if user is logged in
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || 'null');
        if (!token || !user) {
            window.location.href = '../index.html';
        }

        const initial = (user?.username || '?').charAt(0).toUpperCase();
        document.getElementById('header-avatar').textContent = initial;
        document.getElementById('header-username').textContent = user?.username || '';
        document.getElementById('profile-avatar').textContent = initial;
        document.getElementById('profile-name').textContent = user?.username || '';
        document.getElementById('profile-email').textContent = user?.email || '';

        let currentAssessmentId = null;
        let assessmentsCache = [];
        // song_id -> { song, structureTree } — resolved once per song, not once per history row.
        const songInfoCache = new Map();

        function formatDate(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d.getTime())) return iso;
            return d.toLocaleString('zh-TW', { hour12: false });
        }

        function scoreClass(score) {
            if (score >= 85) return 'score-high';
            if (score >= 70) return 'score-mid';
            return 'score-low';
        }

        // Recursively search a GET /songs/{id}/structures tree for a structure's title.
        function findStructureTitle(nodes, id) {
            for (const n of (nodes || [])) {
                if (n.id === id) return n.title;
                const found = findStructureTitle(n.phrases, id);
                if (found) return found;
            }
            return null;
        }

        async function resolveSongInfo(songId) {
            if (songInfoCache.has(songId)) return songInfoCache.get(songId);
            const [song, structuresRes] = await Promise.all([
                api('/songs/' + songId).catch(() => null),
                // GET /songs/{id}/structures responds with { song_id, structures: [...] },
                // not a bare array.
                api('/songs/' + songId + '/structures').catch(() => ({ structures: [] }))
            ]);
            const info = { song, structureTree: structuresRes?.structures || [] };
            songInfoCache.set(songId, info);
            return info;
        }

        async function loadStats() {
            try {
                const stats = await api('/assessments/stats');
                document.getElementById('stat-practices').textContent = stats.total_practices ?? 0;
                document.getElementById('stat-avg-score').textContent = Math.round(stats.average_score ?? 0);
                document.getElementById('stat-songs').textContent = stats.total_songs ?? 0;
            } catch (err) {
                console.error('Failed to load stats:', err);
            }
        }

        async function loadHistory() {
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '<div style="color:#888;padding:16px;">載入中…</div>';

            try {
                assessmentsCache = await api('/assessments?limit=50');
            } catch (err) {
                console.error('Failed to load assessment history:', err);
                historyList.innerHTML = '<div style="color:#888;padding:16px;">無法載入練習記錄，請稍後再試。</div>';
                return;
            }

            if (assessmentsCache.length === 0) {
                historyList.innerHTML = '<div style="color:#888;padding:16px;">還沒有練習記錄，快去練習第一次吧！</div>';
                return;
            }

            const rows = await Promise.all(assessmentsCache.map(async (a) => {
                let songTitle = '（歌曲已刪除）';
                let trackName = '';
                let structureTitle = '整首/自訂範圍';
                const info = await resolveSongInfo(a.song_id);
                if (info.song) {
                    songTitle = info.song.title;
                    const track = (info.song.tracks || []).find(t => t.id === a.track_id);
                    if (track) trackName = track.name;
                }
                if (a.structure_id) {
                    structureTitle = findStructureTitle(info.structureTree, a.structure_id) || '（段落已刪除）';
                }
                return { a, songTitle, trackName, structureTitle };
            }));

            historyList.innerHTML = rows.map(({ a, songTitle, trackName, structureTitle }) => `
                <div class="history-item" id="record-${a.id}">
                    <div class="history-header" style="cursor:pointer;" onclick="window.__viewAssessment('${a.id}')">
                        <div class="history-score ${scoreClass(a.score)}">${Math.round(a.score)}</div>
                        <div class="history-info">
                            <div class="history-song">${songTitle}${trackName ? ' · ' + trackName : ''} - ${structureTitle}</div>
                            <div class="history-detail">${a.matched_notes}/${a.total_notes} 音符匹配</div>
                        </div>
                        <div class="history-date">${formatDate(a.created_at)}</div>
                    </div>
                    <div class="history-actions">
                        <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();window.__downloadAssessment('${a.id}')">📥 下載</button>
                        <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();window.__deleteAssessment('${a.id}')">🗑️ 刪除</button>
                    </div>
                </div>
            `).join('');
        }

        async function loadDashboard() {
            await Promise.all([loadStats(), loadHistory()]);
        }

        async function viewAssessment(id) {
            currentAssessmentId = id;
            const modal = document.getElementById('assessment-modal');
            const content = document.getElementById('assessment-detail-content');
            const a = assessmentsCache.find(x => x.id === id);
            if (!a) {
                content.innerHTML = '<div>找不到這筆記錄</div>';
                modal.classList.add('visible');
                return;
            }

            const info = await resolveSongInfo(a.song_id);
            const songTitle = info.song ? info.song.title : '（歌曲已刪除）';
            const track = info.song ? (info.song.tracks || []).find(t => t.id === a.track_id) : null;
            const structureTitle = a.structure_id
                ? (findStructureTitle(info.structureTree, a.structure_id) || '（段落已刪除）')
                : '整首/自訂範圍';

            content.innerHTML = `
                <div class="assessment-detail">
                    <div class="assessment-detail-row"><span class="detail-label">歌曲</span><span class="detail-value">${songTitle}</span></div>
                    <div class="assessment-detail-row"><span class="detail-label">段落</span><span class="detail-value">${structureTitle}</span></div>
                    <div class="assessment-detail-row"><span class="detail-label">聲部</span><span class="detail-value">${track ? track.name : '-'}</span></div>
                    <div class="assessment-detail-row"><span class="detail-label">分數</span><span class="detail-value" style="color: #27ae60; font-size: 24px;">${Math.round(a.score)}</span></div>
                    <div class="assessment-detail-row"><span class="detail-label">音符匹配</span><span class="detail-value">${a.matched_notes} / ${a.total_notes}</span></div>
                    <div class="assessment-detail-row"><span class="detail-label">平均音高偏差</span><span class="detail-value">${a.average_pitch_deviation.toFixed(1)} cents</span></div>
                    <div class="assessment-detail-row"><span class="detail-label">平均時長偏差</span><span class="detail-value">${a.average_duration_deviation.toFixed(3)} 秒</span></div>
                    <div class="assessment-detail-row"><span class="detail-label">練習時間</span><span class="detail-value">${formatDate(a.created_at)}</span></div>
                </div>
            `;
            modal.classList.add('visible');
        }

        function closeModal() {
            document.getElementById('assessment-modal').classList.remove('visible');
            currentAssessmentId = null;
        }

        // The download endpoint needs the Authorization header, so a plain link/window.open
        // can't carry the JWT — fetch the blob manually instead.
        async function downloadAssessment(id) {
            try {
                const res = await fetch('/api/v1/assessments/' + id + '/download', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'assessment-' + id + '.json';
                document.body.appendChild(link);
                link.click();
                link.remove();
                URL.revokeObjectURL(url);
            } catch (err) {
                console.error('Failed to download assessment:', err);
                alert('下載失敗：' + err.message);
            }
        }

        function downloadCurrentAssessment() {
            if (!currentAssessmentId) return;
            downloadAssessment(currentAssessmentId);
        }

        async function deleteAssessment(id) {
            if (!confirm('確定要刪除這筆練習記錄嗎？此操作無法復原。')) return;
            try {
                await api('/assessments/' + id, { method: 'DELETE' });
                assessmentsCache = assessmentsCache.filter(x => x.id !== id);
                const el = document.getElementById('record-' + id);
                if (el) el.remove();
                loadStats();
            } catch (err) {
                console.error('Failed to delete assessment:', err);
                alert('刪除失敗：' + err.message);
            }
        }

        function deleteCurrentAssessment() {
            if (!currentAssessmentId) return;
            deleteAssessment(currentAssessmentId);
            closeModal();
        }

        function startPractice() {
            window.location.href = 'user-practice.html';
        }

        function scrollToHistory() {
            document.querySelector('.content-area').scrollIntoView({ behavior: 'smooth' });
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '../index.html';
        }

        // Inline onclick="" attributes run in global scope, not module scope, so expose
        // whatever they call on window (same pattern used in user-practice.html).
        window.__startPractice = startPractice;
        window.__scrollToHistory = scrollToHistory;
        window.__logout = logout;
        window.__loadDashboard = loadDashboard;
        window.__viewAssessment = viewAssessment;
        window.__closeModal = closeModal;
        window.__downloadAssessment = downloadAssessment;
        window.__downloadCurrentAssessment = downloadCurrentAssessment;
        window.__deleteAssessment = deleteAssessment;
        window.__deleteCurrentAssessment = deleteCurrentAssessment;

        document.getElementById('assessment-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        loadDashboard();
    </script>
</body>
</html>
