<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者後台 - 歌曲管理</title>

    <link rel="stylesheet" href="admin-common.css">
    <link rel="stylesheet" href="admin-songs.css">
</head>

<body>
    <div class="sidebar">
        <h2>🎤 Vocal Practice</h2>
        <nav>
            <a href="admin-users.html">👥 使用者管理</a>
            <a href="admin-songs.html" class="active">🎵 歌曲管理</a>
            <a href="admin-structures.html">📝 段落結構</a>
            <a href="../index.html">🔙 返回前台</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>歌曲管理</h1>
            <span>管理員</span>
        </div>

        <!-- 上傳 MIDI -->
        <div class="card">
            <h3>上傳 MIDI 檔案</h3>
            <div class="form-group">
                <label for="song-title">歌曲名稱 *</label>
                <input type="text" id="song-title" placeholder="輸入歌曲名稱">
            </div>
            <div class="form-group">
                <label for="song-artist">藝術家 *</label>
                <input type="text" id="song-artist" placeholder="輸入藝術家名稱">
            </div>
            <div class="upload-area" id="upload-area">
                <div class="upload-icon">🎹</div>
                <p>拖曳 MIDI 檔案至此，或點擊選擇檔案</p>
                <input type="file" id="midi-file" accept=".mid,.midi" style="display: none;">
            </div>
            <div class="progress-bar" id="upload-progress" style="display: none;">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div id="file-info" style="margin-top: 12px; color: #666; font-size: 14px;"></div>
            <br>
            <button class="btn btn-primary" id="upload-btn" onclick="uploadSong()">上傳並解析</button>
        </div>

        <!-- 歌曲列表 -->
        <div class="card">
            <h3>歌曲清單</h3>
            <div class="song-grid" id="song-list">
                <div style="grid-column: 1 / -1; text-align: center; color: #999; padding: 40px;">載入中...</div>
            </div>
        </div>
    </div>

    <script>
        // Check if user is logged in and is admin
        (function() {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || 'null');
            if (!token || !user || user.role !== 'admin') {
                window.location.href = '../index.html';
            }
        })();

        const API_BASE = '/api/v1/admin';

        async function api(path, options = {}) {
            const token = localStorage.getItem('token');
            const headers = { ...options.headers };
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }
            const res = await fetch(API_BASE + path, {
                credentials: 'same-origin',
                headers,
                ...options,
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({ error: res.statusText }));
                throw new Error(err.error || `HTTP ${res.status}`);
            }
            return res.json();
        }

        // --- 上傳功能 ---
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('midi-file');
        const fileInfo = document.getElementById('file-info');
        const uploadProgress = document.getElementById('upload-progress');
        const progressFill = document.getElementById('progress-fill');
        const uploadBtn = document.getElementById('upload-btn');

        let selectedFile = null;

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            const name = file.name.toLowerCase();
            if (name.endsWith('.mid') || name.endsWith('.midi')) {
                selectedFile = file;
                fileInfo.textContent = `已選擇: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
            } else {
                fileInfo.textContent = '請選擇 MIDI 檔案 (.mid 或 .midi)';
                selectedFile = null;
            }
        }

        async function uploadSong() {
            if (!selectedFile) {
                alert('請選擇 MIDI 檔案');
                return;
            }
            const title = document.getElementById('song-title').value;
            const artist = document.getElementById('song-artist').value;

            if (!title || !artist) {
                alert('請輸入歌曲名稱和藝術家');
                return;
            }

            const formData = new FormData();
            formData.append('title', title);
            formData.append('artist', artist);
            formData.append('midi_file', selectedFile);

            uploadProgress.style.display = 'block';
            progressFill.style.width = '0%';
            uploadBtn.disabled = true;
            uploadBtn.textContent = '上傳中...';

            // Simulate progress for better UX (actual upload progress is hard with fetch)
            let progress = 0;
            const interval = setInterval(() => {
                progress += 5;
                if (progress > 90) progress = 90;
                progressFill.style.width = progress + '%';
            }, 200);

            try {
                const result = await api('/songs', {
                    method: 'POST',
                    body: formData,
                });

                clearInterval(interval);
                progressFill.style.width = '100%';

                setTimeout(() => {
                    uploadProgress.style.display = 'none';
                    progressFill.style.width = '0%';
                    fileInfo.textContent = '';
                    selectedFile = null;
                    document.getElementById('song-title').value = '';
                    document.getElementById('song-artist').value = '';
                    uploadBtn.disabled = false;
                    uploadBtn.textContent = '上傳並解析';
                    loadSongs();
                    alert(`歌曲「${result.title}」上傳成功！共 ${result.tracks.length} 個聲部`);
                }, 500);
            } catch (err) {
                clearInterval(interval);
                uploadProgress.style.display = 'none';
                progressFill.style.width = '0%';
                uploadBtn.disabled = false;
                uploadBtn.textContent = '上傳並解析';
                alert('上傳失敗：' + err.message);
            }
        }

        // --- 載入歌曲列表 ---
        async function loadSongs() {
            const container = document.getElementById('song-list');
            container.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: #999; padding: 40px;">載入中...</div>';

            try {
                const songs = await api('/songs');

                if (songs.length === 0) {
                    container.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: #999; padding: 40px;">尚無歌曲，請上傳 MIDI 檔案</div>';
                    return;
                }

                container.innerHTML = '';
                for (const song of songs) {
                    const card = document.createElement('div');
                    card.className = 'song-card';
                    const activeBadge = song.is_active ? '' : '<span style="font-size:11px;color:#888;margin-left:8px;">(非活躍)</span>';
                    card.innerHTML = `
                        <h4>${escapeHtml(song.title)} ${song.artist ? '🎵' : ''} <span style="font-size:12px;color:#888;font-weight:normal;">${escapeHtml(song.version_label || '')}</span>${activeBadge}</h4>
                        <p>${escapeHtml(song.artist || '未知藝術家')} · ${song.track_count} 個聲軌</p>
                        <div style="margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap;">
                            <button class="btn btn-secondary" onclick="viewDetails('${song.id}')">設定可練習聲部</button>
                            <button class="btn btn-secondary" onclick="editStructures('${song.id}')">管理段落</button>
                            <button class="btn btn-secondary" onclick="showNewVersionModal('${song.id}', '${escapeHtml(song.title)}', '${escapeHtml(song.artist)}')">📋 新增版本</button>
                            <button class="btn btn-secondary" onclick="showVersions('${song.id}', '${escapeHtml(song.title)}')">📜 版本歷史</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteSong('${song.id}', '${escapeHtml(song.title)}')">刪除</button>
                        </div>
                    `;
                    container.appendChild(card);
                }
            } catch (err) {
                container.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: #e74c3c; padding: 40px;">載入失敗：${err.message}</div>`;
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        async function toggleVocal(songId, trackId, currentValue) {
            try {
                await api('/songs/' + songId + '/tracks/' + trackId, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ is_vocal: !currentValue }),
                });
                viewDetails(songId);
            } catch (err) {
                alert('更新失敗：' + err.message);
            }
        }

        // 將渲染軌道列表的邏輯獨立出來
        function renderTrackList(songId, tracks) {
            let trackHtml = '';
            for (const t of tracks) {
                const badge = t.is_vocal ? '🎤 聲部' : '🎵 伴奏';
                trackHtml += `
            <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#1a1a2e;border-radius:6px;margin-bottom:6px;">
                <span><strong>${escapeHtml(t.name)}</strong> · ${t.note_count} 音符 (ch ${t.channel})</span>
                <div style="display:flex;align-items:center;gap:8px;">
                    <span style="font-size:13px;color:#888;">${badge}</span>
                    <button class="btn btn-sm ${t.is_vocal ? 'btn-warning' : 'btn-success'}" onclick="toggleVocal('${songId}','${t.id}',${t.is_vocal})">
                        ${t.is_vocal ? '設為伴奏' : '設為聲部'}
                    </button>
                </div>
            </div>
        `;
            }
            return trackHtml;
        }

        async function viewDetails(songId) {
            try {
                const song = await api('/songs/' + songId);

                // 檢查畫面上是否「已經有」這個歌曲的彈窗了
                let modal = document.getElementById('song-details-modal');

                if (modal) {
                    // 如果彈窗已經存在，我們「只更新」聲部列表的區塊，然後直接 return
                    const trackContainer = modal.querySelector('#modal-track-container');
                    const trackCountBadge = modal.querySelector('#modal-track-count');
                    if (trackContainer) trackContainer.innerHTML = renderTrackList(song.id, song.tracks);
                    if (trackCountBadge) trackCountBadge.textContent = `聲部 (${song.tracks.length})`;
                    return;
                }

                //如果是第一次打開，才建立全新的彈窗外框
                modal = document.createElement('div');
                modal.id = 'song-details-modal'; // 加上固定 ID 方便追蹤
                modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:1000;';
                modal.onclick = (e) => { if (e.target === modal) modal.remove(); };

                modal.innerHTML = `
            <div style="background:#16213e;border-radius:12px;padding:24px;max-width:600px;width:90%;max-height:80vh;overflow-y:auto;">
                <h3 style="margin-bottom:4px;">${escapeHtml(song.title)}</h3>
                <p style="color:#888;margin-bottom:16px;">${escapeHtml(song.artist)}</p>
                <div style="margin-bottom:16px;">
                    <strong id="modal-track-count" style="color:#888;font-size:13px;">聲部 (${song.tracks.length})</strong>
                    <!-- 給軌道列表一個專屬的 ID 容器，方便局部重新渲染 -->
                    <div id="modal-track-container" style="margin-top:8px;">
                        ${renderTrackList(song.id, song.tracks)}
                    </div>
                </div>
                <button class="btn btn-secondary" onclick="document.getElementById('song-details-modal').remove()">關閉</button>
            </div>
        `;
                document.body.appendChild(modal);
            } catch (err) {
                alert('無法載入歌曲詳情：' + err.message);
            }
        }

        function editStructures(songId) {
            window.location.href = 'admin-structures.html?song=' + songId;
        }

        async function deleteSong(songId, title) {
            if (!confirm(`確定刪除歌曲「${title}」？\n此操作無法復原。`)) return;

            try {
                await api('/songs/' + songId, { method: 'DELETE' });
                loadSongs();
            } catch (err) {
                alert('刪除失敗：' + err.message);
            }
        }

        // --- 版本管理 ---

        let newVersionSourceId = null;

        function showNewVersionModal(songId, title, artist) {
            newVersionSourceId = songId;
            const modal = document.createElement('div');
            modal.id = 'new-version-modal';
            modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:1000;';
            modal.onclick = (e) => { if (e.target === modal) modal.remove(); };

            modal.innerHTML = `
                <div style="background:#16213e;border-radius:12px;padding:24px;max-width:500px;width:90%;">
                    <h3 style="margin-bottom:16px;">📋 新增版本</h3>
                    <p style="color:#888;margin-bottom:16px;">
                        基於歌曲：<strong>${escapeHtml(title)}</strong> - ${escapeHtml(artist)}
                    </p>
                    <p style="color:#aaa;font-size:13px;margin-bottom:12px;">
                        上傳新的 MIDI 檔案作為新版本，系統會自動複製現有的段落結構。
                    </p>
                    <div class="upload-area" id="version-upload-area" style="padding:20px;text-align:center;border:2px dashed #444;border-radius:8px;cursor:pointer;margin-bottom:12px;">
                        <div style="font-size:32px;margin-bottom:8px;">🎹</div>
                        <p style="color:#888;">選擇 MIDI 檔案</p>
                        <input type="file" id="version-midi-file" accept=".mid,.midi" style="display:none;">
                    </div>
                    <div id="version-file-info" style="color:#666;font-size:14px;margin-bottom:12px;"></div>
                    <div class="progress-bar" id="version-upload-progress" style="display:none;">
                        <div class="progress-fill" id="version-progress-fill"></div>
                    </div>
                    <div style="display:flex;gap:8px;justify-content:flex-end;">
                        <button class="btn btn-secondary" onclick="document.getElementById('new-version-modal').remove()">取消</button>
                        <button class="btn btn-primary" id="create-version-btn" onclick="createNewVersion()" disabled>建立新版本</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const uploadArea = modal.querySelector('#version-upload-area');
            const fileInput = modal.querySelector('#version-midi-file');
            const fileInfo = modal.querySelector('#version-file-info');

            uploadArea.addEventListener('click', () => fileInput.click());
            uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.style.borderColor = '#4facfe'; });
            uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = '#444'; });
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = '#444';
                if (e.dataTransfer.files.length) handleVersionFile(e.dataTransfer.files[0], fileInput, fileInfo);
            });
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length) handleVersionFile(e.target.files[0], fileInput, fileInfo);
            });
        }

        function handleVersionFile(file, fileInput, fileInfo) {
            const name = file.name.toLowerCase();
            if (name.endsWith('.mid') || name.endsWith('.midi')) {
                fileInput._file = file;
                fileInfo.textContent = `已選擇: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
                document.getElementById('create-version-btn').disabled = false;
            } else {
                fileInfo.textContent = '請選擇 MIDI 檔案';
                document.getElementById('create-version-btn').disabled = true;
            }
        }

        async function createNewVersion() {
            const modal = document.getElementById('new-version-modal');
            const fileInput = modal.querySelector('#version-midi-file');
            const file = fileInput._file;
            if (!file || !newVersionSourceId) return;

            const progressBar = modal.querySelector('#version-upload-progress');
            const progressFill = modal.querySelector('#version-progress-fill');
            const btn = document.getElementById('create-version-btn');

            progressBar.style.display = 'block';
            btn.disabled = true;
            btn.textContent = '上傳中...';

            let progress = 0;
            const interval = setInterval(() => {
                progress += 5;
                if (progress > 90) progress = 90;
                progressFill.style.width = progress + '%';
            }, 200);

            try {
                const result = await api('/songs/' + newVersionSourceId + '/new-version', {
                    method: 'POST',
                    body: (() => {
                        const fd = new FormData();
                        fd.append('midi_file', file);
                        return fd;
                    })(),
                });

                clearInterval(interval);
                progressFill.style.width = '100%';
                setTimeout(() => {
                    modal.remove();
                    newVersionSourceId = null;
                    loadSongs();
                    alert(`新版本「${result.version_label}」建立成功！段落結構已自動複製。`);
                }, 500);
            } catch (err) {
                clearInterval(interval);
                progressBar.style.display = 'none';
                btn.disabled = false;
                btn.textContent = '建立新版本';
                alert('建立版本失敗：' + err.message);
            }
        }

        async function showVersions(songId, title) {
            try {
                const data = await api('/songs/' + songId + '/versions');

                const modal = document.createElement('div');
                modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:1000;';
                modal.onclick = (e) => { if (e.target === modal) modal.remove(); };

                let html = `
                    <div style="background:#16213e;border-radius:12px;padding:24px;max-width:600px;width:90%;max-height:80vh;overflow-y:auto;">
                        <h3 style="margin-bottom:4px;">📜 版本歷史 - ${escapeHtml(title)}</h3>
                        <p style="color:#888;margin-bottom:16px;font-size:13px;">總共 ${data.versions.length} 個版本</p>
                        <table style="width:100%;border-collapse:collapse;">
                            <thead>
                                <tr style="color:#888;font-size:13px;text-align:left;">
                                    <th style="padding:8px 4px;border-bottom:1px solid #2a2a4a;">版本</th>
                                    <th style="padding:8px 4px;border-bottom:1px solid #2a2a4a;">聲軌</th>
                                    <th style="padding:8px 4px;border-bottom:1px solid #2a2a4a;">上傳時間</th>
                                    <th style="padding:8px 4px;border-bottom:1px solid #2a2a4a;">狀態</th>
                                    <th style="padding:8px 4px;border-bottom:1px solid #2a2a4a;">操作</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                for (const v of data.versions) {
                    const isActive = v.is_active;
                    html += `
                        <tr style="border-bottom:1px solid #1a1a2e;">
                            <td style="padding:10px 4px;"><strong>${escapeHtml(v.version_label)}</strong></td>
                            <td style="padding:10px 4px;color:#888;">${v.track_count}</td>
                            <td style="padding:10px 4px;color:#888;font-size:13px;">${v.created_at}</td>
                            <td style="padding:10px 4px;">
                                ${isActive ? '<span style="color:#2ecc71;font-weight:bold;">✓ 當前版本</span>' : '<span style="color:#666;">非活躍</span>'}
                            </td>
                            <td style="padding:10px 4px;">
                                ${isActive ? '' : `<button class="btn btn-sm btn-primary" onclick="setActiveVersion('${v.id}')">🔙 設為當前</button>`}
                            </td>
                        </tr>
                    `;
                }

                html += `
                            </tbody>
                        </table>
                        <button class="btn btn-secondary" style="margin-top:16px;" onclick="this.closest('div[style]').parentElement.remove()">關閉</button>
                    </div>
                `;
                modal.innerHTML = html;
                document.body.appendChild(modal);
            } catch (err) {
                alert('載入版本歷史失敗：' + err.message);
            }
        }

        async function setActiveVersion(songId) {
            try {
                await api('/songs/' + songId + '/set-active', { method: 'PUT' });
                // Close all modals and refresh
                document.querySelectorAll('div[style*="position:fixed"]').forEach(m => m.remove());
                loadSongs();
                alert('已切換為當前版本！');
            } catch (err) {
                alert('切換版本失敗：' + err.message);
            }
        }

        // --- 初始化 ---
        loadSongs();
    </script>
</body>

</html>
