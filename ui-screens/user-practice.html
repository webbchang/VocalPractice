<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocal Practice - 練習介面</title>
    <link rel="stylesheet" href="user-practice.css">
</head>
<body>
    <div class="header">
        <h1>🎤 Vocal Practice</h1>
        <div class="header-right">
            <div class="user-info">
                <div class="user-avatar">S</div>
                <span id="username-display">singer01</span>
            </div>
            <button class="btn btn-primary" onclick="alert('歷史記錄功能開發中')">歷史記錄</button>
            <button class="btn btn-danger" onclick="window.logout()">登出</button>
        </div>
    </div>

    <div class="main-container">
        <!-- 左側邊欄 -->
        <div class="sidebar">
            <div class="song-info" id="song-info">
                <div class="song-title" id="song-title">請選擇歌曲</div>
                <div class="song-artist" id="song-artist"></div>
            </div>

            <h3>選擇歌曲</h3>
            <div class="track-selector">
                <select id="song-select" onchange="window.onSongChange()" style="width:100%;padding:10px;background:#1a1a2e;color:#eee;border:1px solid #333;border-radius:6px;">
                    <option value="">載入中...</option>
                </select>
            </div>

            <h3>練習主聲部（選取你的旋律）</h3>
            <div id="vocal-tracks">
                <div class="loading-spinner">載入音軌中...</div>
            </div>

            <h3>伴奏聲部（可多選跟著唱）</h3>
            <div id="accompaniment-tracks">
                <div class="no-structures">請先選擇歌曲</div>
            </div>

            <h3>段落與句子</h3>
            <div id="structure-list">
                <div class="no-structures">請先選擇歌曲與聲部</div>
            </div>

            <div id="range-info" class="range-info">選擇一個段落或句子開始練習</div>
            <div id="range-actions" class="range-actions" style="display:none;">
                <button class="btn btn-sm btn-success" onclick="window.startPractice()">🎯 開始練習此範圍</button>
                <button class="btn btn-sm btn-secondary" onclick="window.clearSelection()" style="background:#555;color:#fff;">清除</button>
            </div>
        </div>

        <!-- 主要內容區 -->
        <div class="content-area">
            <div class="visualization-area">
                <div class="viz-header">
                    <span class="viz-title">分析視覺化</span>
                    <div class="viz-tabs">
                        <button class="viz-tab active" onclick="window.switchTab(this, 'pitch')">音高曲線</button>
                        <button class="viz-tab" onclick="window.switchTab(this, 'pitchroll')">鋼琴捲軸</button>
                    </div>
                </div>
                <div class="chart-container" id="chart-area">
                    <div>
                        <div style="font-size:48px;margin-bottom:12px;">🎵</div>
                        <div>請先選擇歌曲與練習範圍</div>
                    </div>
                </div>
            </div>

            <div class="controls-area">
                <div class="control-info">
                    <div class="control-status" id="status-text">準備就緒</div>
                    <div class="control-timer" id="timer">00:00</div>
                </div>
                <button class="record-btn" id="record-btn" onclick="window.togglePlayback()">
                    <svg class="record-icon" viewBox="0 0 24 24">
                        <polygon points="8,5 19,12 8,19" fill="white"/>
                    </svg>
                </button>
                <div class="control-info">
                    <div style="font-size:12px;color:#888;">當前練習</div>
                    <div id="current-range-label" style="font-size:14px;color:#fff;">未選擇</div>
                </div>
            </div>

            <div class="results-panel" id="results-panel">
                <div class="results-grid">
                    <div class="result-stat">
                        <div class="result-stat-value" id="result-matched">-/-</div>
                        <div class="result-stat-label">音符匹配</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-value" id="result-pitch">-</div>
                        <div class="result-stat-label">平均音高偏差</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-value" id="result-duration">-</div>
                        <div class="result-stat-label">平均時長偏差</div>
                    </div>
                </div>
            </div>

            <!-- 歌詞面板 -->
            <div class="lyrics-panel" id="lyrics-panel">
                <div class="lyrics-header">
                    <span class="lyrics-title">📝 歌詞</span>
                    <span class="lyrics-status" id="lyrics-status">未選取</span>
                </div>
                <div class="lyrics-content" id="lyrics-content">
                    <div class="lyrics-placeholder">選擇段落或句子以顯示歌詞</div>
                </div>
            </div>

            <!-- 提示訊息 -->
            <div class="warning-panel" id="warning-panel" style="display:none;margin-top:12px;padding:10px;background:#fff3cd;border:1px solid #ffc107;border-radius:6px;color:#856404;font-size:13px;">
                ⚠️ 重新練習時，錄音就會被覆蓋。
            </div>
        </div>
    </div>

    <!-- 全域模組載入 (midiParser 和 songDataExtractor 維持 window global) -->
    <script src="../assets/js/midiParser.js"></script>
    <script src="../assets/js/songDataExtractor.js"></script>

    <!-- 主入口：ES modules 版本 -->
    <script type="module">
        import state from '../assets/js/state.js';
        import { loadSongs } from '../assets/js/api.js';
        import { playRange, togglePlayback, stopPlayback, getIsPlaying, setOnInterruptCallback } from '../assets/js/audio.js';
        import {
            selectTrack, selectStructure, onSongChange,
            toggleAccompanimentTrack, startPractice, playRangeWithBeats, interruptPractice, stopReplayPlayback
        } from '../assets/js/practice-business.js';
        import {
            renderVocalTracks, renderAccompanimentTracks, renderStructureList,
            updateSelectionUI, clearSelection, switchTab, logout
        } from '../assets/js/practice-ui.js';

        // --- 登入檢查 ---
        (function() {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || 'null');
            if (!token || !user) {
                window.location.href = '../index.html';
            }
        })();

        // --- 將所有事件處理函式掛載到 window，讓 inline onclick 可存取 ---
        window.onSongChange = onSongChange;
        window.selectTrack = selectTrack;
        window.selectStructure = selectStructure;
        window.toggleAccompanimentTrack = toggleAccompanimentTrack;
        window.startPractice = startPractice;
        window.togglePlayback = togglePlayback;
        window.clearSelection = clearSelection;
        window.switchTab = switchTab;
        window.logout = logout;
        window.stopReplayPlayback = stopReplayPlayback;

        // 暴露 playRangeWithBeats 給 inline onclick（段落/句子的 ▶️ 按鈕）
        window.playRangeWithBeats = playRangeWithBeats;

        // 設定中斷回呼：使用者手動停止播放時，中斷練習並丟棄錄音
        setOnInterruptCallback(interruptPractice);

        // 顯示/隱藏覆蓋提示訊息
        const warningPanel = document.getElementById('warning-panel');
        function updateWarningVisibility() {
            if (recordedChunks && recordedChunks.length > 0 && !isPracticeActive) {
                warningPanel.style.display = 'block';
            } else {
                warningPanel.style.display = 'none';
            }
        }
        window.updateWarningVisibility = updateWarningVisibility;

        // 也暴露 bridge 名稱（UI 模板中使用的 window.__ 開頭函式）
        window.__selectTrack = selectTrack;
        window.__selectStructure = selectStructure;
        window.__toggleAccompanimentTrack = toggleAccompanimentTrack;

        // --- 初始化 ---
        loadSongs();
    </script>
</body>
</html>
